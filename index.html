<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-Ink — a Pacman tribute</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-item">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <h1 class="hud-title">PAC-INK</h1>
        <div class="hud-item">
          <span class="hud-label">BEST</span>
          <span id="high-score" class="hud-value">0</span>
        </div>
      </header>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="456" height="552"></canvas>
        <div id="overlay" class="overlay">
          <div id="overlay-title" class="overlay-title">PAC-INK</div>
          <div id="overlay-message" class="overlay-message">Press <kbd>Space</kbd> to start</div>
        </div>
      </div>

      <div class="lives-row">
        <span class="hud-label">LIVES</span>
        <span id="lives" class="lives" aria-label="lives"></span>
      </div>

      <footer class="hint">
        <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hold to move
        <span class="dot-sep">·</span> <kbd>Space</kbd> start
        <span class="dot-sep">·</span> <kbd>P</kbd> pause
      </footer>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
